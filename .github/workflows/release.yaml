name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore CherryTaleAssetDecryptor.csproj

      - name: Build
        run: >
          dotnet build CherryTaleAssetDecryptor.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          -p:IsPublishable=true

      - name: Verify CLI
        run: >
          dotnet run
          --project CherryTaleAssetDecryptor.csproj
          --configuration Release
          --framework net10.0
          --no-build
          -- --help

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish executable
        run: >
          dotnet publish CherryTaleAssetDecryptor.csproj
          --configuration Release
          --framework net10.0
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:IsPublishable=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          cd publish
          7z a "../artifacts/CherryTaleAssetDecryptor-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/*.zip \
            --title "$TAG" \
            --generate-notes
